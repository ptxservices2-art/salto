<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="menu">
  <p class="sr-only">
    Salto é um jogo de plataforma. Use as setas ou as teclas A e D para mover,
    e espaço para pular. Chegue até a bandeira.
  </p>
  <canvas id="game" width="960" height="540" aria-label="Jogo Salto"></canvas>
  <div id="touch" aria-hidden="true">
    <button type="button" id="btn-left" aria-label="Esquerda">◀</button>
    <button type="button" id="btn-right" aria-label="Direita">▶</button>
    <button type="button" id="btn-jump" aria-label="Pular">Pular</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
